<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — DUALFRAME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=dfm2026">
</head>
<body>

  <header class="navbar" id="navbar"></header>

  <div class="page-header">
    <div class="container">
      <h1 id="page-title">About Dual Frame Media</h1>
      <p id="page-subtitle">We turn bold concepts into unforgettable visual experiences</p>
    </div>
  </div>

  <section class="section" id="about-content"></section>

  <footer class="site-footer" id="footer"></footer>
  <button class="back-to-top" id="backToTop" aria-label="Back to top">↑</button>

  <script src="assets/js/config.js?v=dfm2026"></script>
  <script src="assets/js/main.js?v=dfm2026"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const a = SITE_CONFIG.about;
      if (a?.pageTitle) document.getElementById('page-title').textContent = a.pageTitle;
      if (a?.pageSubtitle) document.getElementById('page-subtitle').textContent = a.pageSubtitle;
      document.title = `${a?.pageTitle || 'About'} — ${SITE_CONFIG.brand?.name || 'DUALFRAME'}`;
    });
  </script>
</body>
</html>
