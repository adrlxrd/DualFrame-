<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — BrandName</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=3">
  <style>
    /* Specific video cover header styling */
    .page-header-video-wrap {
      position: relative;
      overflow: hidden;
      background: #0B0B0E !important;
      min-height: 440px;
      height: 50vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }
    .page-header-video-wrap::before {
      display: none !important;
    }
    .page-header-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
      opacity: 0.45;
      pointer-events: none;
      z-index: 1;
    }
    .page-header-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 10, 14, 0.72) 0%, rgba(14, 14, 18, 0.52) 45%, rgba(10, 10, 14, 0.82) 100%);
      pointer-events: none;
      z-index: 2;
    }
    .page-header-content {
      position: relative;
      z-index: 3;
      width: 100%;
    }
    .page-header-video-wrap h1 {
      color: #FFFFFF !important;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.95), 0 1px 4px rgba(0, 0, 0, 0.95);
      letter-spacing: -0.02em;
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <header class="navbar" id="navbar"></header>

  <div class="page-header page-header-video-wrap">
    <video class="page-header-video" autoplay muted loop playsinline>
      <source src="assets/portfolio-bg.mp4" type="video/mp4">
    </video>
    <div class="page-header-overlay"></div>
    <div class="container page-header-content">
      <h1 id="page-title">Our Work</h1>
    </div>
  </div>

  <section class="section" id="portfolio-content"></section>

  <footer class="site-footer" id="footer"></footer>
  <button class="back-to-top" id="backToTop" aria-label="Back to top">↑</button>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const p = SITE_CONFIG.portfolio;
      if (p?.pageTitle) document.getElementById('page-title').textContent = p.pageTitle;
      const sub = document.getElementById('page-subtitle');
      if (sub && p?.pageSubtitle) sub.textContent = p.pageSubtitle;
      document.title = `${p?.pageTitle || 'Portfolio'} — ${SITE_CONFIG.brand?.name || 'Brand'}`;
    });
  </script>
</body>
</html>
